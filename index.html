<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads投稿プロンプト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fcfcfc; color: #1a1a1a; font-family: sans-serif; }
        .tab-active { border-bottom: 2px solid #000; color: #000; font-weight: bold; }
        .hidden-content { display: none !important; }
        .card { background: #fff; border: 1px solid #efefef; transition: all 0.2s; }
        .card:hover { border-color: #ccc; }
        input { border: 1px solid #ddd !important; padding: 12px; border-radius: 4px; width: 100%; font-size: 14px; }
        input:focus { border-color: #000 !important; outline: none; }
    </style>
</head>
<body>

    <div id="auth-screen" class="flex items-center justify-center min-h-screen">
        <div class="w-full max-w-sm p-10 text-center bg-white border border-gray-100 shadow-sm">
            <h1 class="text-sm font-bold mb-10 tracking-[0.3em] uppercase">Threads投稿プロンプト</h1>
            <input type="password" id="pass-input" class="text-center" placeholder="パスワードを入力">
            <button onclick="checkPass()" class="w-full mt-6 bg-black text-white py-4 text-xs font-bold tracking-widest hover:bg-gray-800 transition">LOGIN</button>
        </div>
    </div>

    <div id="main-content" class="hidden-content min-h-screen">
        <header class="bg-white border-b border-gray-100 py-6 text-center sticky top-0 z-20">
            <h1 class="text-base font-bold tracking-tight">Threads投稿プロンプト</h1>
        </header>

        <nav class="flex justify-center bg-white border-b border-gray-100 sticky top-[65px] z-10">
            <button id="btn-buzz" onclick="showCategory('buzz')" class="px-8 py-4 text-xs text-gray-400 tab-active tracking-widest">バズ構文</button>
            <button id="btn-long" onclick="showCategory('long')" class="px-8 py-4 text-xs text-gray-400 tracking-widest">長文投稿</button>
            <button id="btn-rewrite" onclick="showCategory('rewrite')" class="px-8 py-4 text-xs text-gray-400 tracking-widest">リライト投稿</button>
        </nav>

        <main class="max-w-xl mx-auto p-6">
            <div id="list-area" class="space-y-4"></div>
            <div id="editor-area" class="hidden-content bg-white p-10 border border-gray-100">
                <button onclick="backToList()" class="text-[10px] text-gray-400 mb-8 hover:text-black tracking-widest font-bold">← BACK TO LIST</button>
                <h2 id="edit-title" class="text-xl font-bold mb-2"></h2>
                <p id="edit-desc" class="text-xs text-gray-400 mb-10 leading-relaxed"></p>
                <div id="fields-container" class="space-y-6"></div>
                <button onclick="copyToClipboard()" class="w-full mt-12 bg-black text-white py-5 text-xs font-bold tracking-widest hover:bg-gray-800 transition">COPY PROMPT</button>
                <p id="copy-msg" class="text-center mt-6 text-gray-900 font-bold opacity-0 transition text-[10px] tracking-widest uppercase">Copied!</p>
            </div>
        </main>
    </div>

    <script>
        const PASS = "mikann";
        let currentCategory = 'buzz';
        let activePrompt = null;

        // プロンプトデータ格納用（今は空です）
        const prompts = {
            buzz: [],
            long: [],
            rewrite: []
        };

        function checkPass() {
            const val = document.getElementById('pass-input').value;
            if (val === PASS) {
                document.getElementById('auth-screen').classList.add('hidden-content');
                document.getElementById('main-content').classList.remove('hidden-content');
                showCategory('buzz');
            } else {
                alert("パスワードが違います");
            }
        }

        function showCategory(cat) {
            currentCategory = cat;
            ['buzz', 'long', 'rewrite'].forEach(c => document.getElementById('btn-' + c).classList.remove('tab-active'));
            document.getElementById('btn-' + cat).classList.add('tab-active');
            document.getElementById('list-area').classList.remove('hidden-content');
            document.getElementById('editor-area').classList.add('hidden-content');
            const listArea = document.getElementById('list-area');
            listArea.innerHTML = prompts[cat].length === 0 ? '<p class="text-center text-gray-300 text-xs mt-20 tracking-widest">NO DATA</p>' : '';
            prompts[cat].forEach(p => {
                const div = document.createElement('div');
                div.className = "card p-8 cursor-pointer";
                div.innerHTML = `<div class="text-[9px] text-gray-300 font-bold mb-2 tracking-[0.2em]">NO.${p.id}</div><h3 class="font-bold text-base tracking-tight">${p.name}</h3><p class="text-xs text-gray-400 mt-3 leading-relaxed">${p.desc}</p>`;
                div.onclick = () => openEditor(p);
                listArea.appendChild(div);
            });
        }

        function openEditor(p) {
            activePrompt = p;
            document.getElementById('list-area').classList.add('hidden-content');
            document.getElementById('editor-area').classList.remove('hidden-content');
            document.getElementById('edit-title').innerText = p.name;
            document.getElementById('edit-desc').innerText = p.desc;
            const container = document.getElementById('fields-container');
            container.innerHTML = '';
            if (p.fields && p.fields.length > 0) {
                p.fields.forEach(f => {
                    const input = document.createElement('input');
                    input.id = 'f-' + f; input.placeholder = f;
                    container.appendChild(input);
                });
            } else {
                container.innerHTML = '<p class="text-[10px] text-gray-300 tracking-widest text-center">入力項目はありません。そのままコピーしてください。</p>';
            }
        }

        function backToList() { showCategory(currentCategory); }

        function copyToClipboard() {
            let text = activePrompt.prompt;
            if (activePrompt.fields) {
                activePrompt.fields.forEach(f => {
                    const val = document.getElementById('f-' + f).value || `{${f}}`;
                    text = text.replace(new RegExp(`\\{${f}\\}`, 'g'), val);
                });
            }
            navigator.clipboard.writeText(text);
            const msg = document.getElementById('copy-msg');
            msg.style.opacity = '1';
            setTimeout(() => msg.style.opacity = '0', 2000);
        }
    </script>
</body>
</html>
