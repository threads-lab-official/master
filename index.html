<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads Master 29</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        .font-black-italic { font-weight: 900; font-style: italic; letter-spacing: -0.05em; }
        .glass-card { background: #0a0a0a; border: 1px solid #1a1a1a; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .glass-card:hover { border-color: #fff; background: #111; transform: translateY(-5px); }
        input { background: #000 !important; color: #fff !important; border: 1px solid #222 !important; text-align: center; }
        input:focus { border-color: #fff !important; outline: none; }
        .hidden-content { display: none; }
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="auth-screen" class="w-full max-w-sm p-8 text-center">
        <h1 class="text-2xl font-black-italic mb-8 tracking-widest uppercase">ENTER ACCESS KEY</h1>
        <input type="password" id="pass-input" class="w-full p-4 rounded-full mb-6 tracking-[0.5em]" placeholder="••••••">
        <button onclick="checkPass()" class="w-full bg-white text-black py-4 rounded-full font-black uppercase text-sm hover:bg-zinc-200 transition">Unlock</button>
        <p id="error-msg" class="text-red-600 text-xs mt-4 opacity-0">ACCESS DENIED</p>
    </div>

    <div id="main-content" class="hidden-content w-full max-w-6xl p-6">
        
        <div id="main-menu" class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <div onclick="showCategory('buzz')" class="glass-card p-20 rounded-[50px] cursor-pointer group">
                <div class="text-6xl mb-8 group-hover:scale-110 transition duration-500 text-center">🚀</div>
                <h2 class="text-4xl font-black-italic text-center uppercase tracking-tighter">BUZZ</h2>
                <p class="text-zinc-600 text-[10px] text-center mt-4 tracking-[0.3em]">20 STRATEGIES</p>
            </div>
            <div onclick="showCategory('long')" class="glass-card p-20 rounded-[50px] cursor-pointer group">
                <div class="text-6xl mb-8 group-hover:scale-110 transition duration-500 text-center">📜</div>
                <h2 class="text-4xl font-black-italic text-center uppercase tracking-tighter">LONG</h2>
                <p class="text-zinc-600 text-[10px] text-center mt-4 tracking-[0.3em]">6 STRATEGIES</p>
            </div>
            <div onclick="showCategory('rewrite')" class="glass-card p-20 rounded-[50px] cursor-pointer group">
                <div class="text-6xl mb-8 group-hover:scale-110 transition duration-500 text-center">✂️</div>
                <h2 class="text-4xl font-black-italic text-center uppercase tracking-tighter">EDIT</h2>
                <p class="text-zinc-600 text-[10px] text-center mt-4 tracking-[0.3em]">3 STRATEGIES</p>
            </div>
        </div>

        <div id="list-selection" class="hidden w-full max-w-4xl mx-auto">
            <button onclick="goBack('main-menu')" class="text-zinc-600 hover:text-white mb-12 font-black italic tracking-widest text-xs">← EXIT</button>
            <div id="prompt-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <div id="editor" class="hidden w-full max-w-2xl mx-auto glass-card p-12 rounded-[60px]">
            <button onclick="goBack('list-selection')" class="text-zinc-600 hover:text-white mb-10 font-black italic tracking-widest text-xs">← BACK</button>
            <h2 id="edit-title" class="text-5xl font-black-italic mb-2 uppercase tracking-tighter"></h2>
            <p id="edit-desc" class="text-zinc-500 text-xs mb-12 tracking-wider font-bold"></p>
            <div id="fields" class="space-y-8"></div>
            <button onclick="copyFinal()" class="w-full mt-14 bg-white text-black py-7 rounded-[30px] font-black text-2xl uppercase tracking-widest hover:bg-zinc-200 transition active:scale-95">Copy & Launch</button>
            <p id="toast" class="text-center mt-6 text-zinc-500 font-bold opacity-0 transition text-xs tracking-[0.2em]">SUCCESSFULLY COPIED</p>
        </div>

    </div>

    <script>
        const PASS = "mikann";

        function checkPass() {
            const input = document.getElementById('pass-input').value;
            if (input === PASS) {
                document.getElementById('auth-screen').classList.add('hidden-content');
                document.getElementById('main-content').classList.remove('hidden-content');
            } else {
                const err = document.getElementById('error-msg');
                err.style.opacity = '1';
                setTimeout(() => err.style.opacity = '0', 2000);
            }
        }

        // ここにデータを追加していきます
        const prompts = { buzz: [{
    id: 1,
    name: "逆張り・常識破壊型",
    desc: "世間の常識を否定し、実体験に基づいた衝撃の真実で惹きつける",
    fields: ["テーマ", "ターゲット"],
    prompt: `あなたはThreads投稿の専門家です。逆張り・常識破壊型の投稿を作成してください。

【投稿の本質】
世間の常識を否定→自分も信じていた→失敗した→専門家に聞いた→真実がわかった→解決した、という「常識破壊の体験談」を語る形式。読者に「えっ!?」と思わせ、常識を疑うきっかけを与える。

【含めるべき要素】
・常識を否定する衝撃的な冒頭
・「私も◯◯って思ってた」という共感パート
・実際に試して失敗した具体的エピソード
・専門家の意見や科学的根拠
- 実際に改善した方法
- 常識を疑う大切さの気づき

【文章のルール】
- 300-450字
- 改行で読みやすく
- 断定的に書く(「〜です」「〜でした」)
- 具体的な数字を1つ以上含める
- ストーリー形式で自然に流れる文章

【参考例1:スキンケア】
「化粧水つけすぎると逆に乾燥するって知ってました?
私も『保湿=たっぷり化粧水』って信じてて、朝晩500円玉大を3回重ねづけしてたんですよ。
でも肌の乾燥が全然治らなくて。
皮膚科の先生に相談したら『水分の過剰摂取で肌のバリア機能が低下してる』って言われました。
実は肌に必要なのは水分じゃなくて油分。化粧水で水分入れても、蓋をしないと蒸発して逆効果だったんです。
化粧水を10円玉大にして、クリームをしっかり塗るようにしたら2週間で改善しました。
常識って正しいと思われがちですが、やりすぎも良くないんですね。」

【参考例2:ダイエット】
「毎日ジョギングしてるのに痩せない人、実は走りすぎが原因かも。
私も『有酸素運動=ダイエット』って信じて、毎朝5km走ってたんです。
でも3ヶ月で体重が0.5kgしか減らなくて。
トレーナーに相談したら『有酸素運動のやりすぎで筋肉が落ちて、基礎代謝が下がってる』って。
実は週3回の筋トレの方が、基礎代謝が上がって痩せやすい体になるそうです。
ジョギングを週2回に減らして筋トレ始めたら、2ヶ月で3kg落ちました。
常識を疑わないと、努力が無駄になることもあるんだなって痛感しました。」

【参考例3:子育て】
「子どもに『頑張れ』って言うのは逆効果だって知ってました?
私も『励まし=頑張れ』って思って、テスト前の息子に毎日言ってたんですよ。
でもどんどん成績が下がって、勉強嫌いになって。
スクールカウンセラーに相談したら『頑張れは子どもにプレッシャーを与えるだけ』って言われました。
実は子どもが求めてるのは励ましじゃなくて共感。『大変だよね』『よく頑張ってるね』の方が安心するそうです。
声かけを変えたら、1ヶ月後には自分から机に向かうようになりました。
常識だと思ってることが、実は子どもを追い詰めてたんですね。」

【重要な注意点】
- 番号や見出し(「1.冒頭フック」など)は絶対に使わないこと
- 自然な投稿文として完成させる
- 参考例と全く同じ構成・表現にならないよう、テーマに応じて柔軟に構成する
- ただし「常識否定→共感→失敗→専門家の意見→解決→気づき」の流れは意識する
- 必ず読者が「えっ!?」と思う展開を作ること

【テーマ】{テーマ}

【ターゲット】{ターゲット}

上記の要素を自然に含めながら、常識を破壊する体験談型の投稿を作成してください。`
},], long: [], rewrite: [] };

        let activePrompt = null;

        function showCategory(cat) {
            document.getElementById('main-menu').classList.add('hidden-content');
            document.getElementById('list-selection').classList.remove('hidden');
            const grid = document.getElementById('prompt-grid');
            grid.innerHTML = '';
            prompts[cat].forEach(p => {
                const item = document.createElement('div');
                item.className = "p-10 bg-[#050505] rounded-[40px] border border-[#111] hover:border-white cursor-pointer transition flex flex-col justify-center";
                item.innerHTML = `
                    <div class="text-zinc-700 text-[10px] font-mono mb-2 uppercase tracking-widest">Type #${p.id}</div>
                    <div class="font-black text-xl uppercase tracking-tighter mb-1">${p.name}</div>
                    <div class="text-zinc-500 text-[10px] font-bold uppercase tracking-wider">${p.desc}</div>
                `;
                item.onclick = () => openEditor(p);
                grid.appendChild(item);
            });
        }

        function openEditor(p) {
            activePrompt = p;
            document.getElementById('list-selection').classList.add('hidden');
            document.getElementById('editor').classList.remove('hidden');
            document.getElementById('edit-title').innerText = p.name;
            document.getElementById('edit-desc').innerText = p.desc;
            const fDiv = document.getElementById('fields');
            fDiv.innerHTML = '';
            if (p.fields && p.fields.length > 0) {
                p.fields.forEach(f => {
                    const input = document.createElement('input');
                    input.id = 'input-' + f;
                    input.placeholder = f.toUpperCase();
                    input.className = "w-full p-6 rounded-[25px] text-sm tracking-widest font-bold";
                    fDiv.appendChild(input);
                });
            }
        }

        function copyFinal() {
            let text = activePrompt.prompt;
            if (activePrompt.fields) {
                activePrompt.fields.forEach(f => {
                    const val = document.getElementById('input-' + f).value || `[${f}]`;
                    text = text.replace(new RegExp(`\\{${f}\\}`, 'g'), val);
                });
            }
            navigator.clipboard.writeText(text);
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        function goBack(target) {
            document.getElementById('main-menu').classList.add('hidden-content');
            document.getElementById('list-selection').classList.add('hidden');
            document.getElementById('editor').classList.add('hidden');
            if(target === 'main-menu') {
                document.getElementById('main-menu').classList.remove('hidden-content');
            } else {
                document.getElementById(target).classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
