<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads Master Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Threads Master Pro</h1>
        
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchCategory('buzz')">バズ構文</button>
            <button class="tab-btn" onclick="switchCategory('long')">長文投稿</button>
            <button class="tab-btn" onclick="switchCategory('rewrite')">リライト</button>
            <button class="tab-btn" onclick="switchCategory('affiliate')">アフィリエイト</button>
        </div>

        <div class="main-layout">
            <div class="list-section">
                <div id="itemList" class="item-list"></div>
            </div>

            <div class="editor-section">
                <div id="selectedItemInfo" class="selected-info">
                    <h2 id="selectedName">項目を選択してください</h2>
                    <p id="selectedDesc"></p>
                </div>

                <div id="inputForm" class="input-form"></div>
                
                <button id="generateBtn" class="generate-btn" style="display:none;">プロンプトを生成</button>

                <div class="result-area">
                    <textarea id="resultText" readonly placeholder="ここにプロンプトが生成されます..."></textarea>
                    <button id="copyBtn" class="copy-btn">コピーする</button>
                </div>
            </div>
        </div>
    </div>

    
    <script src="data.js"></script>
    <script src="buzz.js"></script>
    <script src="long.js"></script>
    <script src="rewrite.js"></script>
    <script src="affiliate.js"></script>
    <script src="script.js"></script>
</body>
</html>
