<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads投稿プロンプト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        .font-black-italic { font-weight: 900; font-style: italic; letter-spacing: -0.02em; }
        .glass-card { background: #0a0a0a; border: 1px solid #1a1a1a; transition: all 0.3s ease; }
        .glass-card:hover { border-color: #fff; background: #111; }
        input { background: #000 !important; color: #fff !important; border: 1px solid #222 !important; text-align: center; }
        input:focus { border-color: #fff !important; outline: none; }
        .hidden-content { display: none; }
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="auth-screen" class="w-full max-w-sm p-8 text-center">
        <h1 class="text-xl font-black-italic mb-12 tracking-[0.2em] uppercase">THREADS PROMPT SYSTEM</h1>
        <input type="password" id="pass-input" class="w-full p-4 rounded-none mb-6 tracking-[1em]" placeholder="••••••">
        <button onclick="checkPass()" class="w-full bg-white text-black py-4 font-black uppercase text-xs tracking-widest hover:bg-zinc-200 transition">Unlock</button>
        <p id="error-msg" class="text-red-600 text-[10px] mt-4 opacity-0 tracking-widest">ACCESS DENIED</p>
    </div>

    <div id="main-content" class="hidden-content w-full max-w-5xl p-6">
        
        <div id="main-menu" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div onclick="showCategory('buzz')" class="glass-card p-16 cursor-pointer text-center group">
                <h2 class="text-2xl font-black-italic uppercase tracking-tighter mb-2">バズ構文</h2>
                <div class="w-8 h-[1px] bg-zinc-800 mx-auto group-hover:w-16 transition-all"></div>
            </div>
            <div onclick="showCategory('long')" class="glass-card p-16 cursor-pointer text-center group">
                <h2 class="text-2xl font-black-italic uppercase tracking-tighter mb-2">長文投稿</h2>
                <div class="w-8 h-[1px] bg-zinc-800 mx-auto group-hover:w-16 transition-all"></div>
            </div>
            <div onclick="showCategory('rewrite')" class="glass-card p-16 cursor-pointer text-center group">
                <h2 class="text-2xl font-black-italic uppercase tracking-tighter mb-2">リライト投稿</h2>
                <div class="w-8 h-[1px] bg-zinc-800 mx-auto group-hover:w-16 transition-all"></div>
            </div>
        </div>

        <div id="list-selection" class="hidden w-full max-w-3xl mx-auto">
            <button onclick="goBack('main-menu')" class="text-zinc-600 hover:text-white mb-10 font-black italic tracking-widest text-[10px]">← BACK TO MENU</button>
            <div id="prompt-grid" class="grid grid-cols-1 gap-4"></div>
        </div>

        <div id="editor" class="hidden w-full max-w-2xl mx-auto glass-card p-10">
            <button onclick="goBack('list-selection')" class="text-zinc-600 hover:text-white mb-8 font-black italic tracking-widest text-[10px]">← BACK TO LIST</button>
            <h2 id="edit-title" class="text-3xl font-black-italic mb-2 uppercase"></h2>
            <p id="edit-desc" class="text-zinc-500 text-[10px] mb-10 tracking-widest uppercase"></p>
            <div id="fields" class="space-y-4"></div>
            <button onclick="copyFinal()" class="w-full mt-10 bg-white text-black py-5 font-black text-sm uppercase tracking-widest hover:bg-zinc-200 transition">Copy Prompt</button>
            <p id="toast" class="text-center mt-4 text-zinc-500 font-bold opacity-0 transition text-[10px] tracking-widest">COPIED TO CLIPBOARD</p>
        </div>

    </div>

    <script>
        const PASS = "mikann";
        const prompts = { buzz: [], long: [], rewrite: [] };
        let activePrompt = null;

        function checkPass() {
            if (document.getElementById('pass-input').value === PASS) {
                document.getElementById('auth-screen').classList.add('hidden-content');
                document.getElementById('main-content').classList.remove('hidden-content');
            } else {
                const err = document.getElementById('error-msg');
                err.style.opacity = '1';
                setTimeout(() => err.style.opacity = '0', 2000);
            }
        }

        function showCategory(cat) {
            document.getElementById('main-menu').classList.add('hidden-content');
            document.getElementById('list-selection').classList.remove('hidden');
            const grid = document.getElementById('prompt-grid');
            grid.innerHTML = '';
            prompts[cat].forEach(p => {
                const item = document.createElement('div');
                item.className = "p-6 bg-[#050505] border border-[#111] hover:border-zinc-500 cursor-pointer transition";
                item.innerHTML = `
                    <div class="text-zinc-700 text-[9px] font-mono mb-1 tracking-widest">NO.${p.id}</div>
                    <div class="font-black text-lg uppercase tracking-tight">${p.name}</div>
                `;
                item.onclick = () => openEditor(p);
                grid.appendChild(item);
            });
        }

        function openEditor(p) {
            activePrompt = p;
            document.getElementById('list-selection').classList.add('hidden');
            document.getElementById('editor').classList.remove('hidden');
            document.getElementById('edit-title').innerText = p.name;
            document.getElementById('edit-desc').innerText = p.desc;
            const fDiv = document.getElementById('fields');
            fDiv.innerHTML = '';
            if (p.fields) {
                p.fields.forEach(f => {
                    const input = document.createElement('input');
                    input.id = 'input-' + f;
                    input.placeholder = f;
                    input.className = "w-full p-4 rounded-none text-xs tracking-widest";
                    fDiv.appendChild(input);
                });
            }
        }

        function copyFinal() {
            let text = activePrompt.prompt;
            if (activePrompt.fields) {
                activePrompt.fields.forEach(f => {
                    const val = document.getElementById('input-' + f).value || `{${f}}`;
                    text = text.replace(new RegExp(`\\{${f}\\}`, 'g'), val);
                });
            }
            navigator.clipboard.writeText(text);
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        function goBack(target) {
            document.getElementById('main-menu').classList.add('hidden-content');
            document.getElementById('list-selection').classList.add('hidden');
            document.getElementById('editor').classList.add('hidden');
            document.getElementById(target).classList.remove('hidden');
        }
    </script>
</body>
</html>
